problem:
  heading: Why AI hasn't paid off for most small businesses yet
  intro: Most owners I talk to have tried AI. The trouble is that it never became part of how the business runs.
  points:
    - title: Tools without a plan
      text: New AI products launch every week, but without a map of your workflows it's impossible to tell which ones solve a real problem.
    - title: Experiments that don't stick
      text: A few chatbot prompts help here and there, but nothing is connected to your forms, inbox, CRM, or spreadsheets.
    - title: Worries about quality, security, and trust
      text: AI can get facts wrong or mishandle customer data, and your reputation is on the line if it does.
    - title: No proof it's worth it
      text: Without measuring time and money saved, AI stays a cost line instead of an investment you can justify.
included:
  heading: What's included in AI and automation consulting for small businesses
  items:
    - title: Business systems analysis
      text: A walk-through of how work actually moves through your business, to find the manual steps, bottlenecks, and handoffs where AI and automation would make a measurable difference.
    - title: ROI case before you build
      text: For each opportunity, an estimate of hours saved, cost, and revenue impact, so you invest in the projects with the best return first.
    - title: Workflow automation
      text: Automations that connect your forms, email, calendar, CRM, and spreadsheets so routine steps run on their own, reliably.
    - title: AI agents and agentic workflows
      text: AI agents that handle multi-step work like triaging inquiries, drafting replies, researching leads, and preparing reports, with a person approving anything customer-facing.
    - title: Custom AI-powered tools
      text: Small web apps and integrations built when off-the-shelf tools don't fit, developed and deployed with the same full-stack skills I use for websites.
    - title: Security and data safeguards
      text: Access controls, safe handling of customer data, and tool settings reviewed before anything goes live.
    - title: Training and documentation
      text: Plain-English guides and hands-on sessions so you and your team can run and adjust the new workflows.
    - title: Measured results
      text: A before-and-after report on time saved, costs, and capacity, documented as a case study you can share with partners or investors.
process:
  heading: How an AI and automation project works
  steps:
    - title: Map your workflows
      text: We walk through your week and document the repetitive tasks, handoffs, and bottlenecks that drain your time.
    - title: Prioritize by ROI
      text: I rank opportunities by time saved, cost, and risk, so we start with the safest, highest-return wins.
    - title: Build and test
      text: I build the automations and AI agents, test them with real examples, and harden them until they run reliably.
    - title: Deploy and train
      text: The workflows go live with monitoring, documentation, and training for your team.
    - title: Measure and expand
      text: We compare results against the baseline, report the ROI, and expand automation step by step.
audience:
  heading: Who AI and automation consulting is for
  intro: 'This is a good fit if you:'
  items:
    - Run a small business and wear most of the hats yourself
    - Spend hours each week on repetitive admin, sales, or marketing tasks
    - Want to use AI but need someone to build it, not just recommend tools
    - Need to see the return before you commit budget
    - Care about keeping a human touch with your customers
