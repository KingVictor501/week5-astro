problem:
  heading: Why small businesses struggle to get found on Google
  intro: >-
    You may have been told SEO takes forever, or paid for reports that never turned into results. The usual culprits are simpler than that.
  points:
    - title: Technical issues no one has checked
      text: Slow pages, broken links, and pages Google can't crawl quietly hold your site back, no matter how good the content is.
    - title: Content written for you, not your customers
      text: Pages describe what you do in your own terms instead of answering the questions people actually type into search.
    - title: A weak local presence
      text: An incomplete or inconsistent Google Business Profile hands nearby customers to your competitors.
    - title: No way to tell what's working
      text: Without proper tracking, it's impossible to see which pages and searches bring in leads.
included:
  heading: What's included in my SEO services for small businesses
  items:
    - title: Technical SEO audit and fixes
      text: A crawl of your whole site to find speed, indexing, mobile, and structured data problems, then a prioritized fix list or the fixes themselves.
    - title: Keyword and competitor research
      text: The searches your best customers use, how competitive they are, and which ones are realistic wins for a business your size.
    - title: On-page optimization
      text: Titles, headings, internal links, and page copy tuned so each page clearly targets one topic.
    - title: Content planning
      text: A practical calendar of pages and articles that answer customer questions and support your service pages.
    - title: Local SEO
      text: Google Business Profile optimization, consistent business listings, and location pages where they make sense.
    - title: Monthly reporting
      text: Plain-English reports on rankings, traffic, and leads, tied to the goals we set together.
process:
  heading: How the SEO process works
  steps:
    - title: Discovery call
      text: We talk about your business, your customers, and what a good lead looks like for you.
    - title: Audit and research
      text: I review your site, your competitors, and your search opportunities, and share what I find.
    - title: Roadmap
      text: You get a prioritized plan, with quick wins first and then the bigger projects that compound over time.
    - title: Implementation
      text: I fix, optimize, and publish, keeping you in the loop on every change.
    - title: Measure and refine
      text: We review results monthly and shift effort toward what's bringing in customers.
