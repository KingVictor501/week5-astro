faq:
  heading: Questions about SEO for small businesses
  items:
    - question: How long does SEO take to work for a small business?
      answer: >-
        Technical fixes and local profile improvements can show movement within weeks, but most businesses see meaningful gains in traffic and leads over several months. Competitive industries can take longer. After the audit, I'll give you an honest timeline instead of a one-size-fits-all promise.
    - question: Do you guarantee first-page rankings?
      answer: >-
        No, and be wary of anyone who does. Google controls rankings. What I can promise is a clear plan, work that follows Google's guidelines, and reporting that shows exactly what's changing.
    - question: What's the difference between local SEO and regular SEO?
      answer: >-
        Local SEO targets searches with local intent, like "plumber near me," and leans on your Google Business Profile, reviews, and listings. Regular SEO covers your website's visibility for broader searches. Most small businesses need a mix of both.
    - question: Can I do SEO myself?
      answer: >-
        You can do a lot yourself, especially local profile work and writing helpful content. Outside help pays off most for technical issues, strategy, and keeping the work consistent. I'm also happy to build a plan you run yourself, with regular check-ins.
    - question: How much do SEO services cost?
      answer: >-
        It depends on how much work your site needs and how competitive your market is. After a free call, I'll recommend a scope that fits your budget, whether that's a one-time audit or ongoing monthly work.
