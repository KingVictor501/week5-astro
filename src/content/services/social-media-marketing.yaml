problem:
  heading: Why social media feels like a time sink for small businesses
  intro: Business owners tell me the same frustrations again and again.
  points:
    - title: No time to post consistently
      text: Running the business comes first, so social accounts go quiet for weeks at a time.
    - title: Content without a strategy
      text: Posts go out, but nobody's sure who they're for or what they're supposed to achieve.
    - title: Boosted posts that go nowhere
      text: Clicking "boost" spends money but rarely reaches the right audience or drives action.
    - title: No clear link to sales
      text: Likes and follows are nice, but it's unclear whether social brings in any actual customers.
included:
  heading: What's included in my social media marketing services for small businesses
  items:
    - title: Strategy and platform selection
      text: We focus on the one or two platforms where your customers actually spend time, instead of trying to be everywhere.
    - title: Content calendar and creation
      text: A monthly calendar of posts, graphics, and short videos that reflect your brand and answer customer questions.
    - title: Community management
      text: Replies to comments and messages, so potential customers get a timely, friendly response.
    - title: Paid social advertising
      text: Meta and other social ad campaigns with audience targeting, creative testing, and conversion tracking.
    - title: Monthly reporting
      text: Reach, engagement, website visits, and leads from social, explained in plain language.
process:
  heading: How social media marketing works
  steps:
    - title: Get to know your brand
      text: We talk about your customers, your voice, and what you want social media to do for the business.
    - title: Build the plan
      text: I map out platforms, content themes, posting frequency, and an ad strategy if paid social makes sense.
    - title: Create and publish
      text: Content is drafted for your approval, then scheduled and published on a consistent rhythm.
    - title: Advertise and engage
      text: Ads run to targeted audiences while comments and messages get answered promptly.
    - title: Review and improve
      text: Each month we look at what resonated and double down on it.
audience:
  heading: Who social media marketing is for
  intro: 'This is a good fit if you:'
  items:
    - Know your customers are on social media but can't keep up with posting
    - Have tried boosting posts without seeing results
    - Want social ads that send traffic to your website, not just likes
    - Sell to a local or niche audience you can target precisely
proof:
  heading: Social media results
  placeholder: '[REPLACE: social media client result, e.g. growth in leads from social ads, shared with permission]'
faq:
  heading: Social media management and advertising services FAQ
  items:
    - question: What's the difference between social media management and advertising services?
      answer: >-
        Management covers your organic presence: planning, creating, and publishing posts and responding to your community. Advertising is paid placement that reaches people beyond your followers with precise targeting. Most small businesses get the best results from both, with ads amplifying the content that's already working.
    - question: Which social media platforms should my business be on?
      answer: >-
        The ones your customers use. For many local service businesses that means Facebook and Instagram, and for business-to-business companies it's often LinkedIn. I'll recommend where to focus based on your audience rather than spreading you thin.
    - question: Do I need to create the content myself?
      answer: >-
        No. I handle the planning and creation. The most authentic content often includes photos or short clips from your day-to-day work, so I'll make it easy to send those over whenever you have them.
    - question: How much should I spend on social media ads?
      answer: >-
        Start with a test budget large enough to learn which audiences and ads work, then scale what performs. We'll set a budget together based on your goals and what a new customer is worth to you.
    - question: How do you measure success on social media?
      answer: >-
        By the actions that matter to your business, like website visits, inquiries, bookings, and sales from social, tracked with proper tagging and analytics alongside reach and engagement.
