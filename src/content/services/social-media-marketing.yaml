problem:
  heading: Why social media feels like a time sink for small businesses
  intro: Business owners tell me the same frustrations again and again.
  points:
    - title: No time to post consistently
      text: Running the business comes first, so social accounts go quiet for weeks at a time.
    - title: Content without a strategy
      text: Posts go out, but nobody's sure who they're for or what they're supposed to achieve.
    - title: Boosted posts that go nowhere
      text: Clicking "boost" spends money but rarely reaches the right audience or drives action.
    - title: No clear link to sales
      text: Likes and follows are nice, but it's unclear whether social brings in any actual customers.
included:
  heading: What's included in my social media marketing services for small businesses
  items:
    - title: Strategy and platform selection
      text: We focus on the one or two platforms where your customers actually spend time, instead of trying to be everywhere.
    - title: Content calendar curation
      text: A monthly calendar of curated posts, built from your photos, short clips, and news, that reflects your brand and answers customer questions.
    - title: Paid social advertising
      text: Meta and other social ad campaigns with audience targeting, creative testing, and conversion tracking.
    - title: Monthly reporting
      text: Reach, engagement, website visits, and leads from social, explained in plain language.
process:
  heading: How social media marketing works
  steps:
    - title: Get to know your brand
      text: We talk about your customers, your voice, and what you want social media to do for the business.
    - title: Build the plan
      text: I map out platforms, content themes, posting frequency, and an ad strategy if paid social makes sense.
    - title: Curate and schedule
      text: Posts are curated for your approval, then scheduled on a consistent rhythm.
    - title: Advertise
      text: Ads run to targeted audiences, with budgets shifted toward what's working.
    - title: Review and improve
      text: Each month we look at what resonated and double down on it.
audience:
  heading: Who social media marketing is for
  intro: 'This is a good fit if you:'
  items:
    - Know your customers are on social media but can't keep up with posting
    - Have tried boosting posts without seeing results
    - Want social ads that send traffic to your website, not just likes
    - Sell to a local or niche audience you can target precisely
faq:
  heading: 'Social media consulting and advertising services: questions and answers'
  items:
    - question: What's the difference between social media consulting and social media advertising?
      answer: >-
        Social media consulting covers your organic presence: choosing the right platforms, planning what to post, and curating a content calendar from your business's own photos and news. Social media advertising is paid placement that reaches people beyond your followers with precise targeting. Most small businesses get the best results from both, with ads amplifying the posts that already work.
    - question: Which social media platforms should my small business be on?
      answer: >-
        Your small business should be on the platforms your customers already use. For many local service businesses that means Facebook and Instagram, and for business-to-business companies it's often LinkedIn. I'll recommend where to focus based on your audience rather than spreading you thin.
    - question: How often should a small business post on social media?
      answer: >-
        Most small businesses do well posting two to four times a week on one or two platforms, as long as they keep it up. A steady rhythm of useful, real posts from your business builds more trust than bursts of daily posting followed by weeks of silence.
    - question: Do I need to create the content myself?
      answer: >-
        No. I plan the calendar and curate the posts for you. The most authentic content comes from photos and short clips of your day-to-day work, so I make it easy to send those over whenever you have them, and I turn them into a steady, consistent schedule.
    - question: How much should a small business spend on social media ads?
      answer: >-
        A small business should start with a test budget large enough to learn which audiences and ads work, then scale what performs. We'll set a budget together based on your goals and what a new customer is worth to you.
    - question: How do you measure social media marketing results?
      answer: >-
        I measure social media marketing by the actions that matter to your business: website visits, inquiries, bookings, and sales from social. They're tracked with proper tagging and analytics alongside reach and engagement, so you can see what each platform actually brings in.
