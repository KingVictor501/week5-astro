problem:
  heading: Why small businesses are invisible in AI search
  intro: >-
    Plenty of good businesses rank on Google but never come up when someone asks an AI assistant. The reasons are usually fixable.
  points:
    - title: AI can't read or reach your site
      text: Slow pages, content that only loads with JavaScript, and blocked crawlers keep AI systems from reading what you offer.
    - title: No clear answers to quote
      text: Your pages describe services in your own terms, so there's no short, direct answer an AI system can lift and credit to you.
    - title: Weak signals about who you are
      text: Missing structured data, inconsistent business listings, and thin About pages make it hard for AI to trust your business enough to recommend it.
    - title: No way to measure AI visibility
      text: Without tracking, you can't tell whether ChatGPT or Google's AI Overviews mention you, or whether those visits turn into leads.
included:
  heading: What's included in my generative engine optimization services
  items:
    - title: AI search visibility audit
      text: I test how ChatGPT, Gemini, Perplexity, and Google AI Overviews answer the questions your customers ask, and record who gets cited instead of you.
    - title: Generative engine optimization (GEO)
      text: Clear, well-sourced pages that state the facts about your business plainly, so AI systems understand your business and choose to cite it.
    - title: Answer engine optimization (AEO)
      text: Question-led pages and FAQs with direct answers in the first sentence, written to be quoted in AI answers, featured snippets, and voice search.
    - title: Technical SEO and structured data
      text: Speed, crawlability, indexing, and schema markup (Organization, Service, FAQPage, and more) so search engines and AI crawlers can read every page.
    - title: Entity and local presence
      text: A complete Google Business Profile and consistent listings and reviews, so AI systems and Google Maps describe your business the same way.
    - title: Reporting on AI and search traffic
      text: Monthly reporting on Google rankings, AI referral traffic, and leads, plus a re-test of the AI answers we're targeting.
process:
  heading: How GEO, AEO, and SEO work together
  steps:
    - title: Discovery call
      text: We list the questions your best customers ask before they buy and agree on what a good lead looks like.
    - title: Audit
      text: I test those questions in AI assistants and Google, then crawl your site for technical and content gaps.
    - title: Roadmap
      text: You get a prioritized plan, starting with fixes that help both Google rankings and AI citations.
    - title: Build and publish
      text: I fix the technical issues, add structured data, and write or rework answer-first pages, with your review before anything goes live.
    - title: Measure and refine
      text: Each month we re-test the AI answers, review rankings and leads, and shift effort toward what's working.
