faq:
  heading: 'Generative engine optimization services: questions and answers'
  items:
    - question: What is generative engine optimization (GEO)?
      answer: >-
        Generative engine optimization (GEO) is the practice of making your business easy for AI systems like ChatGPT, Gemini, Perplexity, and Google's AI Overviews to find, understand, and cite in their answers. It combines clear, factual content, structured data, and a strong technical foundation so AI models choose your business as a trusted source.
    - question: What is answer engine optimization (AEO)?
      answer: >-
        Answer engine optimization (AEO) is structuring your content so answer engines can quote it directly. That means question-led headings, a direct answer in the first sentence, and FAQ markup. AEO helps you appear in AI answers, Google featured snippets, and voice assistant results.
    - question: What's the difference between GEO, AEO, and SEO?
      answer: >-
        SEO helps your pages rank in Google's search results. AEO shapes your content so answer engines can quote it word for word. GEO makes your business a source that AI models trust and cite when they build an answer. They overlap heavily, and a small business gets the best results by working on all three together.
    - question: Is SEO still important now that people use AI search?
      answer: >-
        Yes. AI assistants and Google's AI Overviews draw heavily on pages that are already crawlable, fast, and ranking well, so technical SEO is the foundation that GEO and AEO build on. What has changed is that ranking alone isn't enough. Your content also needs to give clear, quotable answers.
    - question: How do I get my business mentioned by ChatGPT or Google's AI Overviews?
      answer: >-
        Publish pages that answer your customers' questions directly and accurately, and add structured data so machines can read your business details. Keep your name, services, and contact details consistent across your website, Google Business Profile, and listings. Let AI crawlers access your site, and earn mentions on other reputable sites in your industry.
    - question: Can GEO and AEO help plumbers, HVAC companies, roofers, and law firms compete?
      answer: >-
        Yes, and crowded fields are often where they help most. In plumbing, HVAC, roofing, and law, the top Google Ads spots and rankings are expensive and hard to win. AI assistants build answers differently: they cite businesses whose websites answer the question clearly and whose details match everywhere online. A focused GEO and AEO plan can get a smaller contractor or firm named in those answers without outspending the biggest competitors.
    - question: How long does generative engine optimization take to work?
      answer: >-
        Technical fixes and structured data can be picked up within weeks, but most small businesses see meaningful changes in AI citations and search traffic over several months. AI answers change often, so I re-test the questions we target every month and give you an honest timeline after the audit.
    - question: Do you guarantee that AI tools or Google will recommend my business?
      answer: >-
        No. Nobody controls what ChatGPT, Gemini, or Google shows, and you should be wary of anyone who promises a guaranteed spot. What I can promise is a clear plan, work that follows Google's guidelines, and monthly reporting that shows exactly where you appear and what changed.
    - question: How much do GEO and SEO services cost?
      answer: >-
        The cost depends on how much work your site needs and how competitive your market is. After a free call, I'll recommend a scope that fits your budget, from a one-time AI search visibility audit to ongoing monthly GEO, AEO, and SEO work.
