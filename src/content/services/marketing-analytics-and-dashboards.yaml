faq:
  heading: Questions about custom marketing performance dashboards
  items:
    - question: What is a custom marketing performance dashboard?
      answer: >-
        It's a single report, built around your business goals, that combines data from your website, ads, social media, and lead sources. Instead of generic platform metrics, it shows the numbers you actually use to make decisions.
    - question: What data sources can a dashboard include?
      answer: >-
        Common sources include Google Analytics 4, Google Ads, Google Search Console, Meta ads, and spreadsheets or CRM exports. If a platform can export data, there's usually a way to bring it in.
    - question: Do I need Google Analytics set up first?
      answer: >-
        It helps, but it isn't required. Setting up or fixing GA4 and conversion tracking is part of the work when it's needed, because a dashboard is only as good as the data behind it.
    - question: How long does it take to build a dashboard?
      answer: >-
        Most small business dashboards come together in a few weeks, depending on how many data sources are involved and how much tracking needs fixing first.
    - question: Will I be able to update it myself?
      answer: >-
        Yes. The data refreshes automatically, and the walkthrough covers how to change date ranges, filters, and views. You own the dashboard and the accounts behind it.
