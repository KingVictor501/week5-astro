problem:
  heading: Why small businesses fly blind on marketing data
  intro: The data usually exists. The problem is getting it into a form you can use.
  points:
    - title: Data scattered everywhere
      text: Google Ads, Google Analytics, social platforms, and your inbox each tell part of the story, and none of them agree.
    - title: Tracking that's broken or missing
      text: Key actions like phone calls and form submissions often aren't tracked at all, so results go uncounted.
    - title: Reports nobody reads
      text: Platform reports are packed with metrics that don't connect to revenue, so they get ignored.
    - title: Decisions by gut feel
      text: Without a clear picture, budgets stay where they've always been instead of moving to what works.
included:
  heading: What's included in my marketing analytics dashboard services
  items:
    - title: Tracking audit and setup
      text: A review of Google Analytics 4, Google Tag Manager, and conversion tracking, with fixes so the data is accurate.
    - title: KPI planning
      text: We agree on the handful of numbers that reflect business health, like leads, cost per lead, and revenue by channel.
    - title: Custom dashboard build
      text: A dashboard designed around your KPIs that combines your data sources into one clear view.
    - title: Automated data connections
      text: Data refreshes on its own, so the dashboard stays current without manual exports.
    - title: Walkthrough and training
      text: A recorded walkthrough so you and your team know how to read the dashboard and act on it.
    - title: Ongoing insights (optional)
      text: Monthly reviews where I flag trends, problems, and opportunities in your numbers.
process:
  heading: How a dashboard project works
  steps:
    - title: Discovery
      text: We talk through your goals, your marketing channels, and the questions you can't answer today.
    - title: Audit tracking
      text: I check what's being measured, fix gaps, and make sure conversions are counted correctly.
    - title: Design the dashboard
      text: You review a layout built around your KPIs before anything is connected.
    - title: Build and connect
      text: Data sources are connected, tested, and set to refresh automatically.
    - title: Train and hand off
      text: I walk you through the finished dashboard and stay available for questions.
audience:
  heading: Who a marketing dashboard is for
  intro: 'This is a good fit if you:'
  items:
    - Spend money on more than one marketing channel
    - Can't easily say which channel brings in the most customers
    - Are tired of building spreadsheets by hand every month
    - Want to make budget decisions with confidence
