problem:
  heading: Where small business ad budgets go to waste
  intro: Most underperforming ad accounts share the same handful of problems.
  points:
    - title: Broad keywords and no negatives
      text: Ads show up for searches that will never become customers, and you pay for every one of those clicks.
    - title: Sending clicks to the homepage
      text: Visitors land on a generic page and leave, instead of reaching a focused page that matches the ad they clicked.
    - title: Missing or broken conversion tracking
      text: Without accurate tracking, Google's bidding optimizes for the wrong thing and you can't see your real cost per lead.
    - title: Set-and-forget campaigns
      text: Accounts that aren't reviewed regularly drift toward wasted spend as competitors and search behavior change.
included:
  heading: What's included in my Google Ads management services for small businesses
  items:
    - title: Account audit
      text: A full review of your existing account, or a clean setup if you're starting fresh, with a list of quick fixes.
    - title: Keyword strategy and negative keywords
      text: High-intent keywords for your services, plus negative keyword lists that keep junk searches out.
    - title: Ad copy and assets
      text: Ads that speak to what your customers want, with sitelinks, call buttons, and other assets that make your ad stand out.
    - title: Landing page recommendations
      text: Specific changes, or new pages, so each campaign sends people somewhere built to convert.
    - title: Conversion tracking setup
      text: Calls, form fills, and bookings tracked properly in Google Ads and Google Analytics.
    - title: Ongoing optimization and reporting
      text: Regular bid, budget, and search term reviews, with a monthly report focused on leads and cost per lead.
process:
  heading: How Google Ads management works
  steps:
    - title: Audit
      text: I review your account, website, and tracking to see where money is leaking and where the opportunities are.
    - title: Fix the foundation
      text: Tracking, account structure, and negative keywords get fixed first, so every later decision is based on real data.
    - title: Launch or rebuild campaigns
      text: Focused campaigns go live with tight keyword groups, matching ads, and the right landing pages.
    - title: Optimize every week
      text: I cut wasted spend, test new ads, and move budget toward the keywords that bring in leads.
audience:
  heading: Who Google Ads management is for
  intro: 'This is a good fit if you:'
  items:
    - Already run Google Ads but aren't sure they're paying off
    - Need leads now while slower channels like SEO ramp up
    - Sell a service where one new customer is worth far more than a click
    - Want a clear monthly picture of your cost per lead
