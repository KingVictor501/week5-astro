faq:
  heading: 'PPC management services for lead generation: common questions'
  items:
    - question: What do PPC management services for lead generation include?
      answer: >-
        Everything needed to turn ad spend into inquiries: keyword research, campaign setup, ad writing, landing page guidance, conversion tracking, and ongoing optimization. The focus is on leads and cost per lead, not clicks or impressions.
    - question: How much should a small business spend on Google Ads?
      answer: >-
        Enough to collect meaningful data in your market, which depends on your cost per click and how many leads you need. The ROI calculator on my homepage gives a rough sense of what wasted spend may be costing you, and we can size a budget together on a call.
    - question: How soon will I see leads from PPC?
      answer: >-
        Often within the first few weeks, since ads start showing as soon as campaigns launch. The first month or two is also when we learn the most, so expect performance to improve as waste is cut and targeting is refined.
    - question: Do I need a new landing page?
      answer: >-
        Not always, but sending ad traffic to a page that matches the ad almost always helps. I'll tell you whether your current pages can work or whether a dedicated page is worth building.
    - question: Will I keep ownership of my ad account?
      answer: >-
        Yes. Your account, data, and campaigns stay yours. I work inside your account with access you can remove at any time.
