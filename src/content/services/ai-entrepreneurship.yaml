faq:
  heading: 'AI business automation services for entrepreneurs: FAQ'
  items:
    - question: What can AI business automation services for entrepreneurs actually automate?
      answer: >-
        Common examples include drafting social posts and emails, summarizing customer inquiries, routing new leads into your CRM, scheduling follow-ups, and building simple weekly reports. The best candidates are tasks you repeat often that follow a predictable pattern.
    - question: Will AI replace my marketing team?
      answer: >-
        No. Used well, AI handles first drafts and repetitive steps so people can focus on strategy, relationships, and judgment calls. Anything customer-facing gets a human review.
    - question: Is my business data safe with AI tools?
      answer: >-
        It depends on the tool and its settings. Part of my work is choosing tools with appropriate privacy controls and setting them up so sensitive customer data isn't shared where it shouldn't be.
    - question: Do I need technical skills to use these automations?
      answer: >-
        No. Automations are built to run in the background, and training covers the few things you'll need to do day to day, in plain language.
    - question: How quickly will I see time savings?
      answer: >-
        Simple automations can start saving time as soon as they go live. Larger workflow changes take a few weeks to set up and refine. The assessment shows where the biggest wins are before you commit to anything.
