problem:
  heading: Why AI feels overwhelming for entrepreneurs
  intro: Most entrepreneurs I talk to are curious about AI but stuck for the same reasons.
  points:
    - title: Too many tools
      text: New AI products launch every week, and it's hard to tell which ones solve a real problem for your business.
    - title: Experiments that don't stick
      text: A few chatbot prompts help here and there, but nothing becomes part of the daily workflow.
    - title: Worries about quality and trust
      text: Generic AI content can sound robotic or get facts wrong, and your reputation is on the line.
    - title: No time to set it up
      text: Connecting tools and building automations takes focus that running a business doesn't leave room for.
included:
  heading: What's included in AI consulting for small business entrepreneurs
  items:
    - title: AI opportunity assessment
      text: A review of your marketing and admin workflows to find the tasks where AI saves the most time with the least risk.
    - title: Tool selection
      text: Recommendations for the right AI tools for your budget and needs, and the ones you can safely skip.
    - title: Content workflows
      text: AI-assisted processes for drafting blog posts, social content, and emails in your brand voice, with human review built in.
    - title: Workflow automation
      text: Automations that connect your forms, email, calendar, and spreadsheets so routine steps happen on their own.
    - title: Team training
      text: Hands-on sessions and written guides so you and your team can use the new tools confidently.
    - title: Ongoing support
      text: Check-ins to refine automations and add new ones as your business and the tools evolve.
process:
  heading: How AI consulting works
  steps:
    - title: Map your workflows
      text: We walk through your week and list the repetitive tasks that drain your time.
    - title: Prioritize
      text: I rank opportunities by time saved, cost, and risk, so we start with the safest, biggest wins.
    - title: Build and test
      text: I set up the tools and automations, test them with real examples, and adjust until they work reliably.
    - title: Train and launch
      text: You get training and documentation, and the new workflows go live.
    - title: Improve over time
      text: We review what's working and expand automation step by step.
