problem:
  heading: Common website problems that cost small businesses customers
  intro: If your site isn't bringing in inquiries, one of these is usually why.
  points:
    - title: Slow and outdated
      text: Heavy themes, stacks of plugins, and old templates load slowly, especially on phones, and visitors leave before they see your offer.
    - title: Hard to use on mobile
      text: Most visitors arrive on a phone, and tiny buttons or broken layouts make it hard for them to contact you.
    - title: Invisible to AI search
      text: Missing structured data and pages that search engines and AI crawlers can't read keep your business out of AI answers and search results.
    - title: Boxed in by the platform
      text: Site builders are great until you need a booking flow, a customer portal, or an integration the platform doesn't support.
included:
  heading: What's included in custom website development for small businesses
  items:
    - title: Strategy and sitemap
      text: We plan pages around your services and the questions customers ask, so the site works for visitors, search engines, and AI answer engines.
    - title: Custom design
      text: A clean, on-brand design built for your business, not a generic template.
    - title: Full-stack development
      text: Modern front-end and back-end code built for speed, accessibility, and strong Core Web Vitals, with forms, databases, and APIs where you need them.
    - title: Web apps and integrations
      text: Booking flows, customer portals, calculators, and connections to your CRM, payments, and AI tools, built to fit how you work.
    - title: GEO, AEO, and SEO foundations
      text: Clean URLs, structured data, answer-first FAQs, a sitemap, and fast pages from day one, so you're ready for Google and AI search at launch.
    - title: Security and deployment
      text: HTTPS, secure hosting, protected forms, and automated deployments so the site is safe and goes live without downtime.
    - title: Platform help
      text: Fixes, speed improvements, redesigns, and migrations for WordPress, Shopify, Squarespace, and Wix sites.
    - title: Ongoing management
      text: Updates, backups, security monitoring, and content changes so your site keeps working for you.
process:
  heading: How a website project works
  steps:
    - title: Discovery and planning
      text: We define your goals, audience, pages, and features, and decide whether a custom build or your current platform is the better fit.
    - title: Design
      text: You review designs for key pages, and we refine them together before development starts.
    - title: Build
      text: I develop the site, test it on real devices, and check speed, accessibility, and security.
    - title: Launch
      text: The site goes live with redirects, analytics, structured data, and Google Search Console set up correctly.
    - title: Manage and improve
      text: Ongoing updates and improvements keep the site fast, secure, and current.
audience:
  heading: Who custom website development is for
  intro: 'This is a good fit if you:'
  items:
    - Have an outdated site that doesn't reflect your business today
    - Are launching a new business and need a professional website
    - Have outgrown WordPress, Shopify, Squarespace, or Wix, or need help getting more from it
    - Need features like booking, a customer portal, or AI tools built into your site
    - Want someone reliable to handle updates and maintenance
faq:
  heading: 'Full-stack web development services: questions and answers'
  items:
    - question: What does a full-stack web developer do for a small business?
      answer: >-
        A full-stack web developer builds both sides of a website: the front end visitors see and the back end that handles forms, data, logins, and integrations. For a small business, that means one person can design, build, connect, secure, and deploy your whole site or web app, with no handoffs between specialists.
    - question: Can you help with my WordPress website?
      answer: >-
        Yes. I fix broken WordPress sites, speed up slow themes and plugin-heavy pages, tighten security, add structured data, and redesign or extend existing sites. If WordPress is holding you back, I can also migrate your content to a faster custom build without losing your search rankings.
    - question: Do you work on Shopify stores?
      answer: >-
        Yes. I help Shopify store owners with theme customization, page speed, product page structure, structured data for products, and integrations with email, CRM, and analytics tools. I can also build custom features when an app doesn't do what you need.
    - question: Can you fix or improve my Squarespace site?
      answer: >-
        Yes. I improve Squarespace sites with clearer page structure, better calls to action, SEO and AI search settings, custom code where the platform allows it, and connected forms and analytics. If you've outgrown Squarespace, I can plan a move to a custom site.
    - question: Do you help with Wix websites?
      answer: >-
        Yes. I help Wix site owners improve speed, mobile layouts, SEO settings, and lead capture, and connect their sites to booking, email, and analytics tools. When a business needs more flexibility than Wix offers, I can rebuild the site on a custom stack and set up redirects so you keep your traffic.
    - question: Should I use a website builder or get a custom website?
      answer: >-
        Use a website builder like Squarespace, Wix, or Shopify if you need a simple site quickly and are happy to work within its limits. Choose a custom website when speed, unique features, integrations, or full ownership of your code matter to your business. On a free call, I'll recommend the option that fits your goals and budget.
    - question: Can you move my site from WordPress, Wix, or Squarespace to a custom build?
      answer: >-
        Yes. A migration starts with an inventory of your current pages, content, and the pages that already rank or get cited in search. I rebuild them on the new site, set up 301 redirects from every old URL, and check Google Search Console after launch so you keep the visibility you've earned.
    - question: How long does it take to build a small business website?
      answer: >-
        Most small business websites take several weeks from kickoff to launch, depending on the number of pages, custom features, and how ready your content is. Platform fixes on WordPress, Shopify, Squarespace, or Wix are often done in days. You'll get a timeline after our planning call.
    - question: Will I be able to update my website myself?
      answer: >-
        Yes, if you'd like to. I can set up an easy way for you to edit text and images on a custom site, or keep you on a familiar platform editor. I can also handle updates for you as part of ongoing management.
    - question: Are your websites built for AI search and SEO?
      answer: >-
        Yes. Every site I build launches with fast pages, clean structure, structured data, answer-first FAQs, and a sitemap, so Google and AI answer engines like ChatGPT can read and cite it. Ongoing GEO, AEO, and SEO work is available as a separate service.
