problem:
  heading: Common website problems that cost small businesses customers
  intro: If your site isn't bringing in inquiries, one of these is usually why.
  points:
    - title: Slow and outdated
      text: Heavy pages and old templates load slowly, especially on phones, and visitors leave before they see your offer.
    - title: Hard to use on mobile
      text: Most visitors arrive on a phone, and tiny buttons or broken layouts make it hard for them to contact you.
    - title: No clear next step
      text: Pages describe your business but never make it obvious how to call, book, or request a quote.
    - title: Hard to update
      text: Simple changes require a developer, so the site falls out of date.
included:
  heading: What's included in my small business website development services
  items:
    - title: Strategy and sitemap
      text: We plan pages around your services and the questions customers ask, so the site works for visitors and search engines.
    - title: Custom design
      text: A clean, on-brand design built for your business, not a generic template.
    - title: Fast, accessible development
      text: Modern code built for speed, accessibility, and strong Core Web Vitals.
    - title: SEO foundations
      text: Clean URLs, titles, meta descriptions, structured data, and a sitemap from day one.
    - title: Lead capture
      text: Clear calls to action, forms, and booking options, with conversion tracking set up.
    - title: Ongoing management
      text: Updates, backups, security monitoring, and content changes so your site keeps working for you.
process:
  heading: How a website project works
  steps:
    - title: Discovery and planning
      text: We define your goals, audience, and pages, and gather the content and branding you already have.
    - title: Design
      text: You review designs for key pages, and we refine them together before development starts.
    - title: Build
      text: I develop the site, test it on real devices, and check speed and accessibility.
    - title: Launch
      text: The site goes live with redirects, analytics, and Google Search Console set up correctly.
    - title: Manage and improve
      text: Ongoing updates and improvements keep the site fast, secure, and current.
audience:
  heading: Who website development is for
  intro: 'This is a good fit if you:'
  items:
    - Have an outdated site that doesn't reflect your business today
    - Are launching a new business and need a professional website
    - Get traffic but few inquiries from your current site
    - Want someone reliable to handle updates and maintenance
