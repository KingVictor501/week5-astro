faq:
  heading: 'Custom website design and development for small businesses: FAQ'
  items:
    - question: What does custom website design and development for small businesses include?
      answer: >-
        It covers planning your pages, designing a site around your brand, building it with fast and accessible code, setting up SEO foundations and lead capture, and launching it properly. Unlike a template, every page is designed for your services and customers.
    - question: How long does it take to build a small business website?
      answer: >-
        Most small business sites take several weeks from kickoff to launch, depending on the number of pages and how ready your content is. You'll get a timeline after our planning call.
    - question: Will I be able to update my website myself?
      answer: >-
        Yes, if you'd like to. I can set up an easy way for you to edit text and images, or handle updates for you as part of ongoing management.
    - question: Do you redesign existing websites?
      answer: >-
        Yes. A redesign starts with a review of what's already working on your current site, including pages that rank in search, so you keep that value and redirects are set up properly at launch.
    - question: Is SEO included in website development?
      answer: >-
        SEO foundations are built in: fast pages, clean structure, titles and descriptions, structured data, and a sitemap. Ongoing SEO work, like content and local search, is available as a separate service.
